# Oracle Cloud VM: agentweekly.in over HTTPS (Let's Encrypt via certbot on the VM).
# Copied to /etc/nginx/sites-available/ai-news by the Deploy Oracle workflow.
# The browser calls same-origin /api/v1, which Next.js rewrites to the api container.
#
# Certificate (one-time, already done on the VM; renews via certbot.timer):
#   sudo certbot certonly --nginx -d agentweekly.in -d www.agentweekly.in \
#     --deploy-hook "systemctl reload nginx"

upstream next_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP (domain or bare IP) -> HTTPS apex. ACME challenges are handled by certbot's nginx plugin.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        return 301 https://agentweekly.in$request_uri;
    }
}

# www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.agentweekly.in;

    ssl_certificate     /etc/letsencrypt/live/agentweekly.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentweekly.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://agentweekly.in$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name agentweekly.in;

    ssl_certificate     /etc/letsencrypt/live/agentweekly.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentweekly.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 20m;

    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
