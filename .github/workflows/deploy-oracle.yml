# Deploy to the Oracle Cloud VM after CI passes on main (or run manually).
# Required repository secrets: ORACLE_HOST, ORACLE_USER, ORACLE_SSH_KEY.
# Server layout: repo cloned at /opt/AI-website, .env.production in /opt/AI-website/ai-news-platform.
name: Deploy Oracle

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            cd /opt/AI-website
            git fetch origin --prune
            git checkout -B main origin/main

            cd ai-news-platform
            test -f .env.production || { echo "Missing .env.production on server"; exit 1; }

            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.oracle.yml --env-file .env.production"

            # 1 GB RAM VM: build one image at a time, then swap containers in place (no full `down`).
            $COMPOSE build api
            $COMPOSE build web
            $COMPOSE up -d --remove-orphans
            docker image prune -f

            sudo cp deploy/nginx/oracle-ip.conf /etc/nginx/sites-available/ai-news
            sudo nginx -t && sudo systemctl reload nginx

            sleep 10
            $COMPOSE ps
            curl -fsS -o /dev/null -w "web: %{http_code}\n" http://127.0.0.1:3000/
