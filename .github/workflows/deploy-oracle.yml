# Deploy to the Oracle Cloud VM after CI passes on main (or run manually).
# Runs on the self-hosted runner installed on the VM (label: oracle) — no SSH secrets needed.
# Server layout: repo cloned at /opt/AI-website, .env.production in /opt/AI-website/ai-news-platform.
name: Deploy Oracle

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 45
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      }}
    defaults:
      run:
        working-directory: /opt/AI-website/ai-news-platform
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.oracle.yml --env-file .env.production
    steps:
      - name: Update code
        working-directory: /opt/AI-website
        run: |
          git fetch origin --prune
          git checkout -B main origin/main
          git log --oneline -1

      - name: Check env file
        run: test -f .env.production || { echo "Missing .env.production on server"; exit 1; }

      # 1 GB RAM VM: build one image at a time, then swap containers in place (no full `down`).
      - name: Build images
        run: |
          $COMPOSE build api
          $COMPOSE build web

      - name: Start stack
        run: |
          $COMPOSE up -d --remove-orphans
          docker image prune -f

      - name: Reload nginx
        run: |
          sudo cp deploy/nginx/oracle.conf /etc/nginx/sites-available/ai-news
          sudo nginx -t && sudo systemctl reload nginx

      - name: Smoke test
        run: |
          R="--resolve agentweekly.in:443:127.0.0.1"
          for i in $(seq 1 30); do
            curl -fsS $R -o /dev/null https://agentweekly.in/ && curl -fsS $R -o /dev/null https://agentweekly.in/api/v1/articles && break
            sleep 5
          done
          $COMPOSE ps
          curl -fsS $R -o /dev/null -w "home: %{http_code}\n" https://agentweekly.in/
          curl -fsS $R -o /dev/null -w "api: %{http_code}\n" https://agentweekly.in/api/v1/articles
